<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Benjamin's street wear</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5000">


<style>
    body {
        background-color: #800000; /* Dark Red */
        margin: 0;
        padding: 20px;
    }
</style>

   
</head>
<body>
    <section class="login-section" id="loginSection">
        <h2>Welcome Back!</h2>
        <p>Login to your Benjamin's street wear account</p>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
    <label for="login-password">Password</label>
    <div class="password-wrapper">
        <input type="password" id="login-password" placeholder="Enter your password" required>
        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">👁️</button>
    </div>
</div>
            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
               <a href="#" onclick="forgotPassword()">Forgot Password?</a>
            </div>
            
            <button type="button" onclick="submitLogin()">Login</button>
            <p class="signup-link">Don't have an account? <a href="/signup">Sign Up</a></p>
        </form>
    </section>
    
    <!-- Link to our script.js -->
    <script src="/static/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px; }
        .admin-container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #d63851; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Add New Product</h1>
        <form id="adminForm">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" placeholder="e.g., Cool T-Shirt" required>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" step="0.01" placeholder="e.g., 25.99" required>
            </div>
            <div class="form-group">
                <label for="image">Image URL</label>
                <input type="url" id="image" placeholder="e.g., https://example.com/shirt.jpg" required>
            </div>
            <div class="form-group">
    <label for="category">Category</label>
    <input type="text" id="category" placeholder="e.g., Clothing, Gadgets, Shoes" required>
</div>
            <button type="button" onclick="addProduct()">Add Product</button>
        </form>
                <h2 style="margin-top: 40px; text-align: center;">Delete Product</h2>
        <div id="productList"></div>
    </div>

 <script src="/static/script.js?v=9000"></script>
</body>
</html>

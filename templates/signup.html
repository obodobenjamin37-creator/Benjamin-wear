<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Benjamin's street wear</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5000">

  <style>
    body {
        background-color: #800000; /* Dark Red */
        margin: 0;
        padding: 20px;
    }
</style>
</head>
<body>
       <section class="login-section" id="loginSection">
        <h2>Create Your Account</h2>
        <p>Join Benjamin's street wear</p>
        
        <form class="login-form" id="registerForm">
            
            <div class="form-group">
                <label for="register-email">Email Address</label>
                <input type="email" id="register-email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="register-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password" placeholder="Create a password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('register-password', this)">👁️</button>
                </div>
            </div>
            
          <button type="button" class="btn-login" onclick="submitRegister()">Sign Up</button>
            <p class="signup-link">Already have an account? <a href="/login">Login</a></p>
        </form>
    </section>
    
    <!-- Link to our script.js -->
  <script src="/static/script.js"></script>
</body>
</html>

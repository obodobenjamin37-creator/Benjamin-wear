<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Benjamin's Store</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2024n">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i>Benjamin's Store</i></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/">Shop</a></li>
            <li><a href="/">New Arrivals</a></li>
            <li><a href="/">Sale</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
           <div class="search-container">
      <input type="text" id="searchBar" placeholder="Search products..." onkeypress="if(event.key === 'Enter') searchProducts()" style="padding: 5px; border-radius: 5px; border: none; width: 150px;">
    </div>
    <div class="cart-icon" id="cartIcon">
      🛒 <span class="cart-count" id="cartCount">0</span>
    </div>
    </nav>

    <section class="products" id="products">
        <h2>Search Results for "{{ query }}"</h2>
        <div class="product-grid">
            {% for product in products %}
            <div class="product-card">
                <img src="{{ product.image }}">
                <h3>{{ product.name }}</h3>
                <p class="price">${{ product.price }} / ₦{{ product.price_ngn }}</p>
                <button class="btn-add" onclick="askQuantity('{{ product.name }}', {{ product.price }})">Add to Cart</button>
            </div>
            {% else %}
            <p style="text-align: center; font-size: 1.2rem;">No products found for "{{ query }}"</p>
            {% endfor %}
        </div>
    </section>


<!-- Quantity Popup -->
<div id="quantityModal" class="quantity-popup" style="display: none;">
    <div class="quantity-popup-inner">
        <button class="quantity-close" onclick="closeQuantityModal()" aria-label="Close">&times;</button>
        <div class="quantity-name" id="quantityProductName"></div>
        <div class="quantity-price" id="quantityProductPrice"></div>
        <div class="quantity-row">
            <button type="button" class="qty-btn" onclick="adjustQuantity(-1)">−</button>
           <input type="number" id="quantityInput" value="1" min="1" max="999">
            <button type="button" class="qty-btn" onclick="adjustQuantity(1)">+</button>
            <span class="qty-total" id="quantityTotal">$0.00</span>
        </div>
        <div class="quantity-buttons">
            <button type="button" class="qty-cancel" onclick="closeQuantityModal()">Cancel</button>
            <button type="button" class="qty-confirm" onclick="confirmQuantity()">Add</button>
        </div>
    </div>
</div>

<script src="/static/script.js?v=2024n"></script>
</body>
</html>
